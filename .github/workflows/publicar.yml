name: Publicar posts agendados

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 minutos (mantém como reserva, mesmo com atraso)
  workflow_dispatch:          # permite rodar manualmente também
  repository_dispatch:        # permite ser "acordado" por um serviço externo (cron-job.org)
    types: [publicar-agora]

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node post.js
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Salvar schedule.json atualizado
        run: |
          git config user.name "auto-poster-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json
          git diff --staged --quiet || git commit -m "post publicado automaticamente"
          git pull --rebase origin main 
          git push
